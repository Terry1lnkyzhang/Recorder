      required: false
      default: null
      example: null
    - name: circular
      type: str
      description: Circular mode passed to detector (for example `'out'`). Defaults
        to `'out'`.
      required: false
      default: null
      example: null
    - name: onlyCircle
      type: bool
      description: If True, enforces circle mode in detector. Defaults to True.
      required: false
      default: null
      example: null
    - name: solid
      type: bool
      description: If True, prefers solid shapes. Defaults to False.
      required: false
      default: null
      example: null
    - name: sortTopToBot
      type: bool
      description: If True, sorts by center Y; otherwise sorts by center X. Defaults
        to True.
      required: false
      default: null
      example: null
    - name: returnBoundingRectSize
      type: bool
      description: If True, converts each ellipse size to axis-aligned `(width, height)`
