entries:
- name: Click
  summary: Performs a click on a UI control or at an absolute screen position.
  description: 'This method simulates a mouse click. It can operate in two modes:
    clicking on a specific UI control or clicking at absolute (x, y) coordinates on
    the screen. It supports various options like waiting for the control to be enabled,
    pressing modifier keys, choosing left/right/middle mouse button, and handling
    checkboxes intelligently.'
  source:
    path: Y:\ATFramework\CT_SV_SW\ATFramework\Main\Operation\ControlAction.py
    class: ControlAction
    method: Click
    line: '370'
  aliases: []
  parameters:
  - name: uiControl
    type: auto.Control
    required: false
    description: The UI control to click. If 'absolute' is True in paramDict, this
      may be ignored. Defaults to "Null".
    default: null
    example: null
    schema_fields: []
  - name: paramDict
    type: Dict
    required: true
    description: A dictionary of parameters to customize the click action.
    default: null
    example: null
    schema_fields:
    - name: button
      type: str
      description: 'Mouse button to use. Supported values: ''left'', ''right'', ''middle'',
        ''mid''. Defaults to ''left''.'
      required: false
      default: null
      example: null
    - name: absolute
      type: bool
      description: If True, click at absolute screen coordinates specified by `x`
        and `y`. Defaults to False.
      required: false
      default: null
      example: null
    - name: x
      type: int
      description: X coordinate. In absolute mode, it is the screen x-coordinate;
        if omitted, uses current cursor x. In control mode, it is passed to the control
        click API as the inner x offset.
      required: false
      default: null
      example: null
    - name: y
      type: int
      description: Y coordinate. In absolute mode, it is the screen y-coordinate;
        if omitted, uses current cursor y. In control mode, it is passed to the control
        click API as the inner y offset.
      required: false
      default: null
      example: null
    - name: ratioX
      type: float
      description: Relative horizontal position inside the control when `x` is omitted
        in control mode. Defaults to 0.5 in the underlying control click API.
      required: false
      default: null
      example: null
    - name: ratioY
      type: float
      description: Relative vertical position inside the control when `y` is omitted
        in control mode. Defaults to 0.5 in the underlying control click API.
      required: false
      default: null
      example: null
    - name: simulateMove
      type: bool
      description: If True, move cursor smoothly before a control click. Defaults
        to False for normal left click.
      required: false
      default: null
      example: null
    - name: isChecked
      type: bool
      description: For checkboxes, the desired checked state. The click is skipped
        if the checkbox is already in this state. Defaults to True.
      required: false
      default: null
      example: null
    - name: isEnabled
      type: bool
      description: If True, wait for the control to be enabled before clicking. Defaults
        to False.
      required: false
      default: null
      example: null
    - name: pressKey
      type: str
      description: The name of a modifier key (e.g., "VK_LSHIFT") to hold down during
        the click. Defaults to None.
      required: false
      default: null
      example: null
    - name: waitTime
      type: float
      description: Seconds to wait after the click completes. Defaults to 0.
      required: false
      default: null
      example: null
    - name: duration
      type: float
      description: Seconds to hold the mouse button down. When greater than 0, performs
        a long click and ignores `doubleClick`. Defaults to 0.
      required: false
      default: null
      example: null
    - name: doubleClick
      type: bool
      description: If True, performs two continuous clicks instead of a single click.
        Defaults to False.
      required: false
      default: null
      example: null
    - name: isRecordTime
      type: bool
      description: If True, records the execution start time. Defaults to False.
      required: false
      default: null
      example: null
    - name: getClickStatus
      type: bool
      description: If True, records the button status and saves the results in an
        Excel file. Defaults to False.
      required: false
      default: null
      example: null
    - name: switchCount
      type: int
      description: Number of rounds of value changes to be recorded when button status
        checking is enabled. Defaults to None.
      required: false
      default: null
      example: null
    - name: CheckWaitTime
      type: float
      description: Seconds to wait for the completion of check when button status
        checking is enabled. Defaults to None.
      required: false
      default: null
      example: null
  returns: ''
  examples: []
  exposed_keyword: Click
- name: MoveTo
  summary: Moves the mouse cursor to a specified location. This can be an absolute
    position on the screen or a position relative to a UI control.
  description: "Moves the mouse cursor to a specified location. This can be an absolute\
    \ position on the screen or a position relative to a UI control.\n\nArgs:\n  \
    \  uiControl (auto.Control | optional): The UI control to move the cursor to.\
    \ Defaults to \"Null\".\n    paramDict: A dictionary of parameters to customize\
    \ the move.\n        - absolute (bool): If True, move to absolute screen coordinates.\n\
    \        - x (int): The absolute X-coordinate.\n        - y (int): The absolute\
    \ Y-coordinate.\n        - ratioX (float): The relative X position within the\
    \ control (0.0 to 1.0).\n        - ratioY (float): The relative Y position within\
    \ the control (0.0 to 1.0).\n        - waitTime (float): Time to wait after the\
    \ move."
