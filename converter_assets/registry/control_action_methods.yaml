      required: true
      default: null
      example: null
    - name: waitTime
      type: float
      description: Time to sleep after the keys are sent.
      required: true
      default: null
      example: null
    - name: charMode
      type: bool
      description: If False, uses IME-dependent input.
      required: true
      default: null
      example: null
    - name: debug
      type: bool
      description: If True, prints the expanded key sequence.
      required: true
      default: null
      example: null
  returns: ''
  examples:
