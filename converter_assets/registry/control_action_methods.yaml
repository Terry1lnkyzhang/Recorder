      type: str | Path | PIL.Image.Image
      description: Input image. When missing, this method captures screen image.
      required: false
      default: null
      example: null
    - name: area
      type: list[int]
      description: Capture area ``[left, top, right, bottom]``.
      required: false
      default: null
      example: null
