      description: Match strategy. Default ``auto`` when omitted or empty.
      required: false
      default: null
      example: null
    - name: Values
      type: string
      description: '``auto``, ``exact``, ``contains``, ``regex``. - ``auto`` runs
        OCR once, tries ``exact`` first, and falls back to ``contains`` only when
        exact returns no matches. - ``exact`` requires full equality between query
        and candidate text after optional ``ignoreSpace`` comparison. - ``contains``
        checks whether query is a substring of candidate text after optional ``ignoreSpace``
        comparison. - ``regex`` uses Python regular expression matching on raw OCR
        text.'
      required: false
      default: null
      example: null
    - name: level
      type: str
      description: OCR granularity, ``line`` / ``word``. Default ``line``.
      required: false
      default: null
      example: null
    - name: level usage
      type: string
      description: '``line`` for full-line matching, ``word`` for short keywords.'
      required: false
      default: null
      example: null
    - name: ignoreSpace
      type: bool
      description: If True, exact/contains matching ignores spaces inserted by OCR.
        Default True. Raw OCR text is not changed.
      required: false
      default: null
      example: null
    - name: lang
      type: str
      description: OCR language tag. Default ``en-US``.
      required: false
      default: null
      example: null
    - name: returnAll
      type: bool
      description: Return all matches or first match only. Default True.
      required: false
      default: null
      example: null
    - name: absolute
      type: bool
      description: If True and screenshot is cropped from screen, returned coordinates
        are translated to absolute screen space. Default True.
      required: false
      default: null
      example: null
    - name: returnType
      type: str
      description: '``detail`` (default) or ``center``.'
      required: false
      default: null
      example: null
  returns: list[dict] when ``returnType='detail'``. Each item includes ``text``, ``score``,
    ``box`` ([left, top, right, bottom]) and center coordinates. list[list[int, int]]
    when ``returnType='center'``.
  examples: []
