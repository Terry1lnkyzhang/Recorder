- name: FindCircles
  summary: Finds circles or ellipses on screen by color and size constraints.
  description: This method captures the current screen, detects circle or ellipse
    candidates for one or more colors, removes duplicate or concentric detections
    by geometric similarity, optionally converts ellipse size to axis-aligned bounding
    rectangle size, and returns either centers or full ellipse descriptors.
  source:
    path: Y:\ATFramework\CT_SV_SW\ATFramework\Main\Operation\ControlAction.py
    class: ControlAction
    method: FindCircles
    line: '6673'
  aliases: []
  parameters:
  - name: uiControl
    type: auto.Control
    required: false
    description: Not used for image capture in this method. Defaults to "Null".
    default: null
    example: null
    schema_fields: []
  - name: paramDict
    type: Dict
    required: true
    description: A dictionary of detection parameters.
    default: null
    example: null
    schema_fields:
    - name: diameterUpper
      type: int
      description: Upper diameter limit passed to `ImageIdentification().FindCircle`.
        Defaults to 900.
      required: false
      default: null
      example: null
    - name: diameterLower
      type: int
      description: Lower diameter limit passed to `ImageIdentification().FindCircle`.
        Defaults to 600.
      required: false
      default: null
      example: null
    - name: circleCenterLeft
      type: int
      description: Default left boundary used when `rect` is not provided. Defaults
        to 2249.
      required: false
      default: null
      example: null
    - name: circleCenterRight
      type: int
      description: Default right boundary used when `rect` is not provided. Defaults
        to 3838.
      required: false
      default: null
      example: null
    - name: circleCenterTop
      type: int
      description: Default top boundary used when `rect` is not provided. Defaults
        to 90.
      required: false
      default: null
      example: null
    - name: circleCenterBottom
      type: int
      description: Default bottom boundary used when `rect` is not provided. Defaults
        to 1079.
      required: false
      default: null
      example: null
    - name: rect
      type: list[int]
      description: Input area in `[left, top, right, bottom]`; it is internally reordered
        to `[left, right, top, bottom]` before search.
      required: false
      default: null
      example: null
    - name: circleColor
      type: str | list[str]
      description: Target color or color list. Defaults to `'white'`.
      required: false
      default: null
      example: null
    - name: gaussianBlur
