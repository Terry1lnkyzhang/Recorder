- name: PerformScan
  summary: Perform an interactive scan sequence by watching UI prompt text and issuing
    Enable / Scan key events.
  description: 'High-level flow: poll the current control''s Name; when it matches
    the enable prompt send the "Enable" command, when it matches any scan prompt send
    the "ScanKeyDown" command (optionally timing the press), keep looping until timeout,
    user abort, or end condition. Optionally record the scan start timestamp for duration
    reporting.

    Side Effects:

    - Calls ``self.ScanDll`` with ``Enable`` and ``ScanKeyDown`` (hardware / simulator
    interaction).

    - May set ``ControlManager().startTime`` when ``isRecordTime=True``.

    - Writes debug / info logs and captures a screenshot upon enable.'
  source:
    path: Y:\ATFramework\CT_SV_SW\ATFramework\Main\Operation\ControlAction.py
    class: ControlAction
    method: PerformScan
    line: '3032'
  aliases: []
  parameters:
  - name: uiControl
    type: auto.Control
    required: false
    description: The live prompt label control whose ``Name`` reflects current scan
      state. When it is ``None`` or ``"Null"``, the method falls back to control key
      ``EnableScanLabel``. Defaults to "Null".
    default: null
    example: null
    schema_fields: []
  - name: paramDict
    type: Dict
    required: true
    description: Control parameters.
    default: null
    example: null
    schema_fields: []
  returns: 'bool | None: ``False`` if aborted early (ThreadEventManager signals stop).
    ``None`` on normal completion (including timed scan finish or end-condition exit).
    Logs an error and returns ``None`` on timeout.'
  examples:
