    required: false
    description: Control used to derive capture area when `paramDict['image']` is
      not provided. Defaults to "Null".
    default: null
    example: null
    schema_fields: []
  - name: paramDict
    type: Dict
    required: true
    description: A dictionary of detection parameters.
    default: null
    example: null
    schema_fields:
    - name: image
      type: string
      description: Either a capture region list `[left, top, right, bottom]` or a
        direct image input accepted by the detector.
      required: false
      default: null
      example: null
    - name: rect
      type: list[int]
      description: Search area `[left, top, right, bottom]`.When provided, rectangle
        detection runs only inside this area.
      required: false
      default: null
      example: null
    - name: thresh
      type: int
      description: Binary threshold used by rectangle detection. Defaults to 115.
      required: false
      default: null
      example: null
    - name: epsilon
      type: float
      description: Polygon approximation coefficient. Defaults to 0.1.
      required: false
      default: null
      example: null
    - name: color
      type: str | dict
      description: 'Color filter name or HSV range dict `{''Lower'': [...], ''Upper'':
        [...]}`.'
      required: false
      default: null
      example: null
    - name: minArea
      type: int | float
      description: Minimum contour area. Defaults to 400.
      required: false
      default: null
      example: null
    - name: hierarchyMode
      type: str
      description: '`all`/`outer`/`inner`/`leaf`. Defaults to `outer`.'
      required: false
      default: null
      example: null
    - name: deduplicate
      type: bool
      description: Whether to merge highly overlapped rectangles by IoU. Defaults
        to True.
      required: false
      default: null
      example: null
    - name: iouThreshold
      type: float
      description: IoU threshold for deduplication. Defaults to 0.95.
      required: false
      default: null
      example: null
    - name: absolute
      type: bool
      description: If True and a capture area is used, convert local coordinates to
        screen coordinates. Defaults to False. When a valid `rect` is provided, absolute
        output is enabled automatically.
      required: false
      default: null
      example: null
    - name: sortBy
      type: str
      description: '`none`/`x`/`y`/`centerX`/`centerY`/`area`. Defaults to `none`.'
      required: false
      default: null
      example: null
    - name: reverse
      type: bool
      description: Sort order when `sortBy` is set. Defaults to False.
      required: false
      default: null
      example: null
  returns: A list of detected rectangles. Coordinates are local to the processed image
    unless absolute output is enabled.
  examples: []
  exposed_keyword: FindRectangles
