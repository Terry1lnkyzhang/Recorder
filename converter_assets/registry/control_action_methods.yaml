  description: This is an enhanced version of `FindChildControl` that works with scrollable
    containers. It iterates through the scrollable area of the parent control, performing
    a search at each position until a matching child control is found. If a single
    control is found (and `findAll` is False), it attempts to scroll the container
    to bring the found control to the center of the viewport, which can help stabilize
    subsequent actions like clicks.
